name: Dialogue Cut
icon_initials: DC
processes:
  Dialogue Cut UI:
    command: pnpm --dir ./ui run tauri dev
    working_dir: .
    auto_start: false
    auto_restart: false
    restart_when_changed:
      - ui/src/**/*.ts
      - ui/src/**/*.css
      - ui/src-tauri/src/**/*.rs
      - ui/src-tauri/tauri.conf.json
      - ui/package.json
